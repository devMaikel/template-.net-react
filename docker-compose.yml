services:
  frontend:
    container_name: BauGamesFront
    build: ./frontend
    ports:
      - "80:80"
    platform: linux/x86_64
    working_dir: /app
    depends_on:
      - backend
    # volumes:
    #   - ./frontend:/app
    #   - /app/node_modules
    # stdin_open: true
    # tty: true

  backend:
    container_name: BauGamesBack
    build:
      context: ./backend
      dockerfile: Dockerfile
    ports:
      - "5001:5000" # https
      - "5002:5002" # http
    depends_on:
      - db
    environment:
      - ASPNETCORE_URLS=http://+:5000
      - DOTNET_USE_POLLING_FILE_WATCHER=1
    volumes:
      # - ./backend:/app
      - /app/bin
      - /app/obj

  db:
    image: mcr.microsoft.com/azure-sql-edge:latest
    container_name: my_sql_server
    ports:
        - 1433:1433
    environment:
      - ACCEPT_EULA=Y
      - MSSQL_SA_PASSWORD=SenhaForte@123
      - MSSQL_PID=Developer