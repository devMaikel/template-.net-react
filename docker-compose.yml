# watch / hot reload

services:
  frontend:
    container_name: BauGamesFront
    build: ./frontend
    ports:
      - "80:80"
    volumes:
      - ./frontend:/app # Sincronizar arquivos com o contêiner
      - /app/node_modules # Excluir node_modules do host
    environment:
      - CHOKIDAR_USEPOLLING=true # Necessário em alguns sistemas para hot reload
    depends_on:
      - backend

  backend:
    container_name: BauGamesBack
    build:
      context: ./backend
      dockerfile: Dockerfile
    ports:
      - "5001:5000" # HTTPS
      - "5002:5002" # HTTP
    environment:
      - ASPNETCORE_URLS=http://+:5000
      - DOTNET_USE_POLLING_FILE_WATCHER=1 # Hot reload para .NET
    volumes:
      - ./backend:/app
      - /app/bin
      - /app/obj
    depends_on:
      - db

  db:
    image: mcr.microsoft.com/azure-sql-edge:latest
    container_name: my_sql_server
    ports:
      - 1433:1433
    environment:
      - ACCEPT_EULA=Y
      - MSSQL_SA_PASSWORD=SenhaForte@123
      - MSSQL_PID=Developer
